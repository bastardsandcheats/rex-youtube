# Copy to config/config.yml. This file is public; put real tokens only in config.yml.
server:
  host: 0.0.0.0
  port: 8790
  public_url: ""                 # Optional address Rex uses to reach this relay.
  log_level: INFO

rex:
  url: "http://REX_HOST:REX_PORT"
  token: ""                      # Or set REX_TOKEN in the service environment.
  source_id: youtube             # Keep this stable when upgrading an existing catalog.

scan:
  max_extracts: 0                # Legacy provider work limit; incremental YouTube is uncapped.
  backfill_batch_size: 25        # Historical metadata jobs per hour; new discoveries have priority.
  cpu_percent: 20                # Average scanner CPU budget, as % of one core.
                                 # Yields after extraction calls; playback is unaffected.
  snapshot_hours: 6              # Complete cached inventory; skipped after failed/incomplete scans.
  interval_seconds: 900
  batch_size: 5                   # New items per source, per poll.
  max_items: 1000                 # Latest collection entries considered per poll.
                                 # Existing catalog entries are retained, not pruned.
playback:
  max_height: 1080
  live_buffer_mb: 16              # RAM read-ahead per live playback (1–64 MiB).

defaults:                        # Inherited by sites, then by their source entries.
  # type defaults to auto; override with show, movie, live or collection.
  probe: headers                 # true: full ffprobe JSON from the relay; false: no probe.
                                 # headers: existing lightweight muxed-HLS track check.
  refresh_hours: 24              # Use 0 to skip age-only refresh of existing uploads.
  # Collection names use native Rex feed collections (Rex 7e064697 or newer).
  collection: false              # true: channel-named collection; or supply a shared name.
  collection_type: movie         # With type: collection, uploads become movies (or show).
  live_collection: true          # Group the Live Streams library by site; or set a name/false.
  year_seasons: true              # false puts a show's episodes into `season` below.
  season: 1
  check_live: false               # Check a supported channel's separate live URL too.

sites:
  youtube:
    enabled: true
    library: YouTube             # Show library. Defaults to the provider's name.
    movie_library: YouTube Videos
    live_library: Live Streams    # Shared by all sites unless overridden here.
    check_live: false
    # probe: false               # Site override: rely on extractor metadata without ffprobe.
    # collection: Learning      # Add channel shows to this collection without changing type.
    # max_items: 0              # Discover every upload rather than a capped window.
    # interval_seconds: 86400   # Poll this site daily; 0 inherits the worker interval.
    max_items: 100                 # Site default; individual sources can override it.
    sources:
      - url: https://www.youtube.com/@TechnologyConnections/videos
        type: show
        name: Technology Connections  # Show name, or a single movie's title.
        year_seasons: true
        max_items: 20
        check_live: false
        enabled: true
      - url: https://www.youtube.com/@Computerphile/videos
        type: show
        year_seasons: false
        season: 1
        max_items: 30
      - url: https://www.youtube.com/@NASA/live
        type: live                # Explicit live URLs are checked even when the site default is false.
        name: NASA ISS Live

  vimeo:
    library: Vimeo
    sources:
      - url: https://vimeo.com/linuxfoundation
        type: show
        name: Linux Foundation
        max_items: 10

  twitch:
    library: Twitch VODs
    live_library: Live Streams
    sources:
      - url: https://www.twitch.tv/csharpfritz/videos
        type: show
        check_live: true          # Index archives and check the channel's current broadcast.
        max_items: 10

  # Any supported extractor can be used here, even before adding a provider file.
  # To disable a site/source without removing its settings, set enabled: false.
  # Site/source overrides also accept max_height and batch_size.

  dailymotion:
    sources:
      - url: https://www.dailymotion.com/TechRadar
        type: show
        name: TechRadar
        max_items: 10
      - url: https://www.dailymotion.com/Clubic
        type: show
        max_items: 10

  peertube:
    sources:
      - url: https://framatube.org/c/joinpeertube/videos
        type: show
      - url: https://video.blender.org/c/blender_open_movies/videos
        type: show
        name: Blender Open Movies
        max_items: 10

  tiktok:
    sources:
      - url: https://www.tiktok.com/@astrosamantha
        type: show
        name: Samantha Cristoforetti
      - url: https://www.tiktok.com/@nasa
        type: show
        name: NASA
      - url: https://www.tiktok.com/@weathernewslive/live
        type: live
        name: Weathernews Live

  bilibili:
    enabled: false               # Experimental: anonymous access was blocked in testing.
    sources:
      - url: https://www.bilibili.com/video/BV15z4y1F7tK/
        type: movie

# Group several associated channels without merging their shows:
# sites:
#   youtube:
#     sources:
#       - url: https://www.youtube.com/@level1techs/videos
#         type: show
#         collection: Level1Techs
#       - url: https://www.youtube.com/@Level1Linux/videos
#         type: show
#         collection: Level1Techs
# To make a channel's uploads individual films in a named collection instead:
#       - url: https://www.youtube.com/@level1techs/videos
#         type: collection
#         collection: Level1Techs
#         probe: false
# Do not add a second `sites` block; merge examples into the existing one.
